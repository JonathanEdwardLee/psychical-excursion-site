name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run package:release
      - run: npm run verify:release
      - run: npm run verify:canonical
      - run: npm run verify:brand
      - run: npm run verify:privacy
      - run: npm run test:publish
      - run: npm run report:release
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pex-release-${{ github.sha }}
          path: release/
          if-no-files-found: error

  publish-hostinger-deploy:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'JonathanEdwardLee/psychical-excursion-site'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:release
      - run: npm run verify:release
      - run: npm run verify:canonical
      - run: npm run verify:brand
      - run: npm run verify:privacy
      - name: Publish hostinger-deploy artifact branch
        run: bash scripts/publish-hostinger-deploy.sh
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
